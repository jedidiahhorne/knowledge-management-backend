version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: knowledge-management-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=sqlite:///./knowledge_management.db
      - SECRET_KEY=dev-secret-key-change-in-production
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8000
    volumes:
      - ./uploads:/app/uploads
      - ./knowledge_management.db:/app/knowledge_management.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: PostgreSQL database for production-like setup
  # Uncomment to use PostgreSQL locally instead of SQLite
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: knowledge-management-db
  #   environment:
  #     - POSTGRES_USER=knowledge_user
  #     - POSTGRES_PASSWORD=knowledge_password
  #     - POSTGRES_DB=knowledge_management
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U knowledge_user"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

# volumes:
